name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Builds the code and runs it on made-up data; needs no other permission.
permissions:
  contents: read

jobs:
  checks:
    name: Build and tests
    runs-on: ubuntu-24.04
    # Lares needs GTK 4.22, which Ubuntu 26.04 has.
    container: ubuntu:26.04
    timeout-minutes: 15
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libgtk-4-dev glib-networking nodejs ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The privacy gate reads the pull request's commits.
          fetch-depth: 0
      - name: Privacy gate (tracked files and commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node tools/privacy-gate.mjs --self-test
          node tools/privacy-gate.mjs
          if [ -n "$BASE" ]; then node tools/privacy-gate.mjs --commits "$BASE..$HEAD"; fi
      - name: Build and test
        run: make check

  windows-checks:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure and build (MSVC /W4 /WX)
        run: |
          cmake -S win -B win/build -A x64
          cmake --build win/build --config Release
      - name: Run Windows unit tests
        run: ctest --test-dir win/build -C Release --output-on-failure
      # The runner is a throwaway machine: the file types test offers Lares
      # for real there and checks Windows' own list of handlers before,
      # during and after (issue #159), in a step of its own so its line shows.
      # On a PC someone works on it stays on a test key.
      - name: Lares in Open with, for real on the runner, and gone after
        env:
          LARES_TEST_REAL_FILETYPES: "1"
        run: win/build/Release/lares-win-unit.exe
      # ctest already ran lares-guard-test against a stand-in taskbar. This
      # runs it against the runner's own taskbar, when it has one, and prints
      # what the guard costs.
      - name: Guard against the real taskbar, and its measured cost
        env:
          # The runner is a throwaway machine; on a PC someone works on the
          # real-taskbar cases stay off.
          LARES_TEST_REAL_TASKBAR: "1"
        run: |
          win/build/Release/lares-guard-test.exe --real
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          win/build/Release/lares-guard-test.exe --measure 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # ctest already turned the bar and dock on and off once, against a
      # stand-in taskbar. This does it ten times in a row against the
      # runner's own taskbar, with a shell that reserves its strips, and
      # measures the shell at rest.
      - name: Bar and dock switches, ten times, on the real taskbar, and the shell's measured cost
        # It takes about four minutes; a hang must not hold the runner.
        timeout-minutes: 15
        env:
          LARES_TEST_REAL_TASKBAR: "1"
        run: |
          win/build/Release/lares-shell-test.exe --real --cycles 10 --measure 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # lares-view.exe (issue #151): both viewers drawn with made-up files,
      # then a picture and a Markdown file opened for real on the runner's
      # desktop, its own memory measured, and the program gone with its last
      # window.
      - name: Viewers drawn, measured, and ended with their last window
        shell: powershell
        run: |
          $d = (Resolve-Path win/build).Path + "\view-check"
          New-Item -ItemType Directory -Force $d | Out-Null
          $p = Start-Process -FilePath win/build/Release/lares-view.exe -ArgumentList "--snapshot `"$d`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Output "the snapshot failed"; exit 1 }
          Set-Content -Path "$d\notes.md" -Value "# Notes`n`nA **made-up** file.`n`n- [ ] one`n- [x] two" -Encoding UTF8
          Add-Type 'using System; using System.Runtime.InteropServices; public static class W { [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t); [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint m, IntPtr w, IntPtr l); }'
          $view = Start-Process -FilePath win/build/Release/lares-view.exe -ArgumentList "--view `"$d\viewer.png`"" -PassThru
          Start-Sleep -Seconds 2
          Start-Process -FilePath win/build/Release/lares-view.exe -ArgumentList "--text `"$d\notes.md`"" -Wait
          Start-Sleep -Seconds 3
          $view.Refresh()
          Write-Output ("lares-view.exe with a picture and a Markdown file open: own memory {0:N1} MB, working set {1:N1} MB" -f ($view.PrivateMemorySize64 / 1MB), ($view.WorkingSet64 / 1MB))
          $mods = $view.Modules | ForEach-Object { $_.ModuleName.ToLower() } | Where-Object { $_ -match 'd3d|dxgi|d2d1|webview|coreclr|clrjit|chrome' }
          if ($mods) { Write-Output "loaded: $mods"; exit 1 }
          $closed = 0
          foreach ($c in 'LaresViewerWnd', 'LaresTextViewWnd') {
            $h = [W]::FindWindowW($c, [NullString]::Value)
            if ($h -ne [IntPtr]::Zero) { [W]::PostMessageW($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null; $closed++ }
          }
          if ($closed -ne 2) { Write-Output "expected two windows, found $closed"; exit 1 }
          if (-not $view.WaitForExit(8000)) { Write-Output "lares-view.exe did not end with its last window"; exit 1 }
          Write-Output "lares-view.exe ended with its last window"

      # lares-files.exe (issue #153): drawn on a made-up folder, then opened
      # on one for real (a second start handing a folder to the first, which
      # opens it as a tab), its own memory measured, and the program gone
      # with its last window.
      - name: Files drawn, measured, and ended with its last window
        shell: powershell
        run: |
          $d = (Resolve-Path win/build).Path + "\files-check"
          New-Item -ItemType Directory -Force $d | Out-Null
          $p = Start-Process -FilePath win/build/Release/lares-files.exe -ArgumentList "--snapshot `"$d`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Output "the snapshot failed"; exit 1 }
          New-Item -ItemType Directory -Force "$d\Made up\Inner" | Out-Null
          1..40 | ForEach-Object { Set-Content -Path ("$d\Made up\note {0:D2}.txt" -f $_) -Value "a made-up note" }
          Add-Type 'using System; using System.Runtime.InteropServices; public static class F { [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowW(string c, string t); [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr h, uint m, IntPtr w, IntPtr l); [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid); }'
          $files = Start-Process -FilePath win/build/Release/lares-files.exe -ArgumentList "`"$d\Made up`"" -PassThru
          Start-Sleep -Seconds 2
          Start-Process -FilePath win/build/Release/lares-files.exe -ArgumentList "`"$d\Made up\Inner`"" -Wait
          Start-Sleep -Seconds 3
          $files.Refresh()
          Write-Output ("lares-files.exe with two folders open in tabs: own memory {0:N1} MB, working set {1:N1} MB" -f ($files.PrivateMemorySize64 / 1MB), ($files.WorkingSet64 / 1MB))
          $mods = $files.Modules | ForEach-Object { $_.ModuleName.ToLower() } | Where-Object { $_ -match 'd3d|dxgi|d2d1|webview|coreclr|clrjit|chrome' }
          if ($mods) { Write-Output "loaded: $mods"; exit 1 }
          $closed = 0
          for ($i = 0; $i -lt 4; $i++) {
            $h = [F]::FindWindowW('LaresFilesWnd', [NullString]::Value)
            if ($h -eq [IntPtr]::Zero) { break }
            $wpid = 0; [F]::GetWindowThreadProcessId($h, [ref]$wpid) | Out-Null
            if ($wpid -ne $files.Id) { Write-Output "a Files window from another process"; exit 1 }
            [F]::PostMessageW($h, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
            $closed++
            Start-Sleep -Milliseconds 500
          }
          if ($closed -ne 1) { Write-Output "expected one Files window with two tabs, closed $closed"; exit 1 }
          if (-not $files.WaitForExit(8000)) { Write-Output "lares-files.exe did not end with its last window"; exit 1 }
          Write-Output "lares-files.exe ended with its last window"
      # ctest already crashed the stand-in shell and checked its report; this
      # keeps one report and runs the privacy gate over it.
      - name: A crash report passes the privacy gate
        run: |
          win/build/Release/lares-crash-test.exe --keep win/build/crash-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/privacy-gate.mjs --files win/build/crash-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The shell's drawing engine (issue #140): both engines draw the same
      # screens on a clean Windows, each in a process of its own.
      - name: Drawing engines compared
        run: |
          win/build/Release/lares-draw-bench.exe compare --frames 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Privacy gate (built programs)
        run: node tools/privacy-gate.mjs --binaries win/build/Release
      # The measurement script runs, compares, and writes nothing private.
      - name: Measurement script (snapshot, compare, privacy gate)
        shell: powershell
        run: |
          ./tools/measure.ps1 -Out win/build/snapshot.json -IdleSeconds 5 -Label ci
          ./tools/measure.ps1 -Before win/build/snapshot.json -After win/build/snapshot.json
          node tools/privacy-gate.mjs --files win/build/snapshot.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
