name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Builds the code and runs it on made-up data; needs no other permission.
permissions:
  contents: read

jobs:
  checks:
    name: Build and tests
    runs-on: ubuntu-24.04
    # Lares needs GTK 4.22, which Ubuntu 26.04 has.
    container: ubuntu:26.04
    timeout-minutes: 15
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libgtk-4-dev glib-networking nodejs ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The privacy gate reads the pull request's commits.
          fetch-depth: 0
      - name: Privacy gate (tracked files and commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node tools/privacy-gate.mjs --self-test
          node tools/privacy-gate.mjs
          if [ -n "$BASE" ]; then node tools/privacy-gate.mjs --commits "$BASE..$HEAD"; fi
      - name: Build and test
        run: make check

  windows-checks:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure and build (MSVC /W4 /WX)
        run: |
          cmake -S win -B win/build -A x64
          cmake --build win/build --config Release
      - name: Run Windows unit tests
        run: ctest --test-dir win/build -C Release --output-on-failure
      # ctest already ran lares-guard-test against a stand-in taskbar. This
      # runs it against the runner's own taskbar, when it has one, and prints
      # what the guard costs.
      - name: Guard against the real taskbar, and its measured cost
        env:
          # The runner is a throwaway machine; on a PC someone works on the
          # real-taskbar cases stay off.
          LARES_TEST_REAL_TASKBAR: "1"
        run: |
          win/build/Release/lares-guard-test.exe --real
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          win/build/Release/lares-guard-test.exe --measure 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # ctest already crashed the stand-in shell and checked its report; this
      # keeps one report and runs the privacy gate over it.
      - name: A crash report passes the privacy gate
        run: |
          win/build/Release/lares-crash-test.exe --keep win/build/crash-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/privacy-gate.mjs --files win/build/crash-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Privacy gate (built programs)
        run: node tools/privacy-gate.mjs --binaries win/build/Release
      # The measurement script runs, compares, and writes nothing private.
      - name: Measurement script (snapshot, compare, privacy gate)
        shell: powershell
        run: |
          ./tools/measure.ps1 -Out win/build/snapshot.json -IdleSeconds 5 -Label ci
          ./tools/measure.ps1 -Before win/build/snapshot.json -After win/build/snapshot.json
          node tools/privacy-gate.mjs --files win/build/snapshot.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
