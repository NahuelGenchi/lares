name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Builds the code and runs it on made-up data; needs no other permission.
permissions:
  contents: read

jobs:
  checks:
    name: Build and tests
    runs-on: ubuntu-24.04
    # Lares needs GTK 4.22, which Ubuntu 26.04 has.
    container: ubuntu:26.04
    timeout-minutes: 15
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libgtk-4-dev glib-networking nodejs ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: make check

  windows-checks:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure and build (MSVC /W4 /WX)
        run: |
          cmake -S win -B win/build -A x64
          cmake --build win/build --config Release
      - name: Run Windows unit tests
        run: ctest --test-dir win/build -C Release --output-on-failure
